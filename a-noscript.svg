<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470">
  <rect width="860" height="470" fill="#ffffff"/>
  <rect x="0" y="0" width="860" height="62" fill="#b00020"/>
  <text x="24" y="40" font-family="Menlo,monospace" font-size="24" font-weight="bold" fill="#ffffff">ARBITRARY ATTACKER SCRIPT IS EXECUTING</text>
  <text x="24" y="92" font-family="Menlo,monospace" font-size="15" fill="#555555">This SVG was written by the reporter and fetched from a third party host.</text>
  <text x="24" y="114" font-family="Menlo,monospace" font-size="15" fill="#555555">Everything below was written into this page by the script inside it.</text>
  <g id="out" font-family="Menlo,monospace" font-size="19" fill="#111111"></g>
  <text x="24" y="404" font-family="Menlo,monospace" font-size="13" fill="#777777">This script makes no network request, reads no credential and stores nothing.</text>
  <text x="24" y="426" font-family="Menlo,monospace" font-size="13" fill="#777777">It only prints the origin of the document it is running in.</text>
  <text x="24" y="448" font-family="Menlo,monospace" font-size="13" fill="#777777">Static asset for an authorized, privately reported vulnerability. Not an attack on any third party.</text>
  <rect x="1" y="1" width="858" height="468" fill="none" stroke="#cccccc"/>
  
</svg>
